<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060914">
  <title>Publications · Communication Systems Research Group</title>
  <meta name="description" content="Peer-reviewed journal, conference, and patent publications from the Communication Systems Research Group at BRAC University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="publications">
  <div id="site-header"></div>

  <main id="main">
   <section class="pagehead">
  <div class="wrap pagehead__grid">
    <div>
      <p class="eyebrow">Publications</p>
      <h1>Peer-reviewed research output.</h1>
    </div>
    <div class="pubstats" id="pubStats" aria-label="Publication summary"></div>
  </div>
</section>

    <section class="section">
      <div class="wrap">
        <div class="pubtools">
          <div class="pubfilters" id="pubFilters">
            <div class="fgroup">
              <button class="fbtn is-on" data-filter="type:all">All types</button>
              <button class="fbtn" data-filter="type:journal">Journals</button>
              <button class="fbtn" data-filter="type:conference">Conferences</button>
              <button class="fbtn" data-filter="type:patent">Patents</button>
            </div>
            <div class="fgroup">
              <button class="fbtn is-on" data-filter="faculty:all">Everyone</button>
              <button class="fbtn" data-filter="faculty:saha">Saha</button>
              <button class="fbtn" data-filter="faculty:islam">Islam</button>
            </div>
          </div>
          <input type="search" class="pubsearch" id="pubSearch" placeholder="Search title, venue, author…" aria-label="Search publications">
        </div>

        <ul class="publist" id="allPubs"></ul>
        <p id="pubEmpty">No publications match those filters.</p>
        <nav class="pagination" id="pubPager" aria-label="Publications pages"></nav>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>
(function () {
  var el = document.getElementById("pubStats");
  if (!el || typeof PUBLICATIONS === "undefined") return;
  var P = PUBLICATIONS, by = function (t) { return P.filter(function (p) { return p.type === t; }).length; };
  var cites = 0, hasC = false;
  if (typeof PEOPLE !== "undefined") {
    PEOPLE.forEach(function (pr) { (pr.stats || []).forEach(function (s) {
      if (/citation/i.test(s.label)) { var n = parseInt(String(s.value).replace(/[^0-9]/g, ""), 10); if (!isNaN(n)) { cites += n; hasC = true; } }
    }); });
  }
  var citeStr = cites >= 1000 ? (Math.floor(cites / 100) / 10) + "k+" : cites + "+";
  var cells = [["Total", P.length], ["Journals", by("journal")], ["Conferences", by("conference")],
               ["Patents", by("patent")], ["Awards", P.filter(function (p) { return p.award; }).length]];
  if (hasC) cells.push(["Citations", citeStr]);
  el.innerHTML = cells.map(function (c) {
    return '<div class="pubstats__cell"><b>' + c[1] + '</b><span>' + c[0] + "</span></div>";
  }).join("");
})();
</script>
</body>
</html>
